[project]
name = "nanogpt"
version = "0.1.0"
description = "A from-scratch, character-level GPT in PyTorch with CLI training, checkpointing, and sampling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
